<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-i18n-title="t0.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="TorqueX: как снять лог Test0 (MS41–MS45) — пресеты, сценарии заездов, что прислать.">
<title>TorqueX</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="ui.js"></script>
<script src="api.js"></script>
<script src="page.js"></script>
</head>
<body data-page="test0">
<a class="skip-link" href="#main" data-i18n="common.skip"></a>
<header class="site-header" id="tx-header"></header>
<div id="tx-demo-banner"></div>
<p id="tx-live" class="sr-only" role="status" aria-live="polite"></p>
<p id="tx-alert" class="sr-only" role="alert" aria-live="assertive"></p>
<div id="tx-toasts" class="toasts" aria-live="polite"></div>

<main id="main" class="wrap">
  <h1 data-i18n="t0.title"></h1>
  <p class="lead" data-i18n="t0.lead"></p>

  <section class="card">
    <h2 data-i18n="t0.need_title"></h2>
    <ul class="list">
      <li data-i18n="t0.need1"></li>
      <li data-i18n="t0.need2"></li>
      <li data-i18n="t0.need3"></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-i18n="t0.steps_title"></h2>
    <ol class="steps-list">
      <li data-i18n="t0.s1"></li>
      <li data-i18n="t0.s2"></li>
      <li data-i18n="t0.s3"></li>
      <li data-i18n="t0.s4"></li>
    </ol>
  </section>

  <section class="card">
    <h2 data-i18n="t0.when_title"></h2>
    <div class="table-scroll">
      <table class="table">
        <thead>
          <tr>
            <th scope="col" data-i18n="t0.when_head"></th>
            <th scope="col" data-i18n="t0.when_what"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">stage0</th>
            <td data-i18n="t0.w_stage0"></td>
          </tr>
          <tr>
            <th scope="row">ignition</th>
            <td data-i18n="t0.w_ignition"></td>
          </tr>
          <tr>
            <th scope="row">limits</th>
            <td data-i18n="t0.w_limits"></td>
          </tr>
          <tr>
            <th scope="row">vanos</th>
            <td data-i18n="t0.w_vanos"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="t0.after_title"></h2>
    <p data-i18n="t0.after_text"></p>
  </section>

  <section class="card">
    <h2 data-i18n="t0.send_title"></h2>
    <p data-i18n="t0.send_text"></p>
    <p class="hint" data-i18n="t0.privacy"></p>
  </section>

  <section class="card">
    <h2 data-i18n="t0.problems_title"></h2>
    <ul class="list">
      <li data-i18n="t0.p1"></li>
      <li data-i18n="t0.p2"></li>
      <li data-i18n="t0.p3"></li>
    </ul>
  </section>
</main>

<footer class="site-footer" id="tx-footer"></footer>
</body>
</html>
